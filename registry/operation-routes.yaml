schema_version: "1.0"

# Canonical projection policy for fast or low-reasoning models.  User prose
# describes the request and an evidence inventory; it is not itself a passed,
# content-addressed gate.  Models must preserve native statuses in gate/finding
# details while emitting the single normalized top-level projection below.
response_policy:
  natural_language_evidence: unverified-inventory-only
  positive_evidence_requirement: bundle-verified-hash-bound-gate-evidence
  route_selection: requested-terminal-intent
  canonical_route_output: registered-skill-id-or-null
  terminal_intent_routes:
    external-publish: null
    destructive-delete: null
    scheduler-submit: dft-hpc-execution
    scheduler-control: dft-hpc-execution
    execution-authorization: dft-project-orchestrator
    scientific-acceptance-decision: dft-project-orchestrator
    structure-export: dft-structure-preparation
    structure-transformation: dft-structure-preparation
    scientific-report: dft-reporting
    review-response: dft-review-response
    literature-plan: literature-to-dft-plan
  claim_ceiling_basis: highest-fully-satisfied-gate-profile
  unverified_claim_ceiling: no_positive_claim
  canonical_status_output: action-state
  hard_block_action_state: local_gate_blocked
  missing_evidence_action_state: needs_evidence
  native_status_reporting: preserve-in-gates-and-finding-codes
  action_state_precedence: [failed_terminal, failed_recoverable, local_gate_blocked, needs_evidence, needs_authorization, ready_for_deterministic_check, deterministic_check_running, ready_for_authorized_execution, execution_in_progress, handoff_ready, local_gate_passed_limited, complete]

# This registry is the machine-facing weak-model routing boundary. A route is
# executable only when both lifecycle=active and routable=true. Development and
# planned routes describe promotion requirements, but deliberately have
# no first tool or tool sequence. handoff.consumers contains only active live
# targets; non-active future targets are isolated in future_consumers.
routes:
  cif-structure-analysis:
    lifecycle: active
    routable: true
    required_reads:
      - skills/cif-structure-analysis/SKILL.md
      - skills/cif-structure-analysis/references/structure-manifest.md
    first_tool:
      explain: cif.analyze
      structure_analysis: cif.analyze
    tool_sequence:
      explain: [cif.analyze]
      structure_analysis: [cif.analyze]
    side_effects: [local-write, local-execution]
    minimum_evidence:
      - CIF source bytes and a safe source label
      - selected data block or explicit acceptance of block index zero
      - explicit query options for requested numeric structure facts
    native_status_mapping:
      PASS: pass
      WARN: warn
      BLOCK: blocked
      MATCHED: pass
      NO_MATCH: pass
      NOT_REQUESTED: not_applicable
    maximum_claim: eligible_for_expert_review
    actions:
      cif.analyze:
        argv:
          - python3
          - -B
          - skills/cif-structure-analysis/scripts/analyze_cif.py
          - --input
          - <cif-file>
          - --json
          - <derived-json>
          - --markdown
          - <derived-markdown>
        success_exit_codes: [0]
        limited_exit_codes: []
        side_effects: [local-write, local-execution]
        requires_authorization: false
        maximum_claim: eligible_for_expert_review
    claim_gate_profile:
      no_positive_claim: {all_of: [], any_of: []}
      documented_behavior_only: {all_of: [structure-analysis], any_of: []}
      input_gates_only: {all_of: [structure-analysis], any_of: []}
      technical_run_gates_only: {all_of: [structure-analysis], any_of: []}
      numerical_candidate_only: {all_of: [structure-analysis], any_of: []}
      eligible_for_expert_review: {all_of: [structure-analysis, structure-claim-boundary], any_of: []}
    handoff:
      status: enabled
      produces:
        - structure-manifest@1.0
      consumers:
        - qe-rigorous-calculations
        - vasp-rigorous-calculations
        - cp2k-rigorous-calculations
        - siesta-rigorous-calculations
        - dft-postprocess
      future_consumers:
        - dft-structure-preparation
      requirements:
        - schema-valid manifest with source SHA-256 and structure fingerprint
        - preserve occupancy, disorder, symmetry, and representative-model warnings

  qe-rigorous-calculations:
    lifecycle: active
    routable: true
    required_reads:
