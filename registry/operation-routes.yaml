        limited_exit_codes: []
        side_effects: [local-write, local-execution]
        requires_authorization: false
        maximum_claim: input_gates_only
      qe.audit-run:
        argv: [python3, -B, skills/qe-rigorous-calculations/scripts/qe_guard.py, audit, --input, <input>, --output, <output>, --run-dir, <run-dir>, --pseudo-dir, <pseudo-dir>, --pseudo-manifest, <pseudo-manifest>, --expected-version, <version>, --plan, <plan-json>, --out, <audit-json>]
        success_exit_codes: [0]
        limited_exit_codes: []
        side_effects: [local-write, local-execution]
        requires_authorization: false
        maximum_claim: technical_run_gates_only
      qe.convergence:
        argv: [python3, -B, skills/qe-rigorous-calculations/scripts/qe_guard.py, convergence, --csv, <series-csv>, --plan, <plan-json>, --protocol-id, <protocol-id>, --parameter, <parameter>, --parameter-unit, <parameter-unit>, --observable, <observable>, --observable-unit, <unit>, --absolute-tolerance, <tolerance>, --tail, <tail>, --out, <convergence-json>]
        success_exit_codes: [0]
        limited_exit_codes: []
        side_effects: [local-write, local-execution]
        requires_authorization: false
        maximum_claim: numerical_candidate_only
      qe.validate-handoff:
        argv: [python3, -B, tools/validate_contract.py, run, <run-manifest>]
        success_exit_codes: [0]
        limited_exit_codes: []
        side_effects: [local-execution]
        requires_authorization: false
        maximum_claim: eligible_for_expert_review
    claim_gate_profile:
      no_positive_claim: {all_of: [], any_of: []}
      documented_behavior_only: {all_of: [], any_of: [official-source-coverage]}
      input_gates_only: {all_of: [input-integrity], any_of: []}
      technical_run_gates_only: {all_of: [input-integrity, execution-completion], any_of: []}
