registry_id: vibedft-active-evidence

# This ledger records activation-evidence truth independently from lifecycle
# and route/task maturity. A legacy-unclosed record preserves current routing
# while prohibiting claims that an independent promotion review was completed.
records:
  cif-structure-analysis:
    skill_id: cif-structure-analysis
    lifecycle: active
    source_tree_sha256: "b8b08e3a84cf4464aed1f267501841c0dfb0801ea8842fe591d49d948e4f58c0"
    activation_evidence_status: legacy-unclosed
    promotion_evidence: null
    route_maturity_refs:
      - path: skills/cif-structure-analysis/references/structure-manifest.md
        sha256: "eab6ca45f26ace346d20a01353410cf16c78ac19fba198ee608ed5e3dbd7f269"
        scope: Route-specific structure-manifest behavior only; not independent activation evidence.
    context_refs: []
    known_limitations: &legacy_limitations
      - No independently reviewed, commit-bound activation or promotion bundle is retained for this inherited active lifecycle.
    closure_requirements: &legacy_closure_requirements
      - Complete a two-phase promotion review using activation-checklist@1.1, task-maturity@1.1, promotion-delta@1.1, and a passing validation report.
      - Bind the verified promotion bundle to the active source-tree SHA-256.
    prohibited_claims: &legacy_prohibited_claims
      - independent-activation-review-complete
      - active-lifecycle-evidence-closed
      - aggregate-maturity-upgraded-from-activation-status

