schema_version: "1.0"

# List-form x-vibe-semantic-obligations are owned by the immutable bundle
# dispatcher. Object-form declarations name their validator explicitly.
validators:
  bundle-semantic-dispatcher:
    implementation: implemented
    entrypoint: tools/validate_bundle.py
    dispatcher: tools/bundle_semantics.py
    scope: immutable-bundle
    unavailable_policy: block
    maximum_claim_when_unavailable: no_positive_claim
  commit-aware-promotion-validator:
    implementation: blocked
    entrypoint: null
    dispatcher: null
    scope: legacy-single-commit-promotion-draft
    unavailable_policy: block
    maximum_claim_when_unavailable: no_positive_claim
    blocker: >-
      The 1.0 activation and promotion drafts require a record to contain the
      SHA of the same Git commit that stores that record, creating an impossible
      self-reference. They remain preserved for audit and permanently blocked.
  two-phase-promotion-validator:
    implementation: implemented
    entrypoint: tools/validate_promotion.py
    dispatcher: tools/validate_promotion.py
    scope: candidate-source-commit-plus-review-artifact-commit
    unavailable_policy: block
    maximum_claim_when_unavailable: no_positive_claim
  qe-2d-epc-validator:
    implementation: implemented
    entrypoint: tools/validate_qe_2d_epc.py
    dispatcher: tools/validate_qe_2d_epc.py
    scope: qe-two-dimensional-phonon-epc-tc-evidence
    unavailable_policy: block
    maximum_claim_when_unavailable: no_positive_claim

policies:
  unknown_validator: reject
  duplicate_obligation_id_within_contract: reject
  malformed_obligation_declaration: reject
  implemented_validator_without_entrypoint: reject
  blocked_validator_positive_claim: reject
