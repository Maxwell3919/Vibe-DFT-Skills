schema_version: "1.0"

# Temporary, exact-set migration ledger for repository-local official-document
# registration packs. A first pack and its `pack-required` transition must land
# atomically. Once promoted, an entry must never return to `legacy-missing`.
migration_policy:
  temporary: true
  removal_condition: replace-with-pack-required-when-first-pack-is-added
  downgrade_policy: forbidden

