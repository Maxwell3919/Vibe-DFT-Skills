schema_version: "1.0"
as_of: "2026-07-18"
snapshot:
  kind: fixed-current-machine-observation
  observed_on: "2026-07-18"
  machine_class: apple-silicon-macos
  dynamic_detection: false

# These profiles document exact provider boundaries. They do not install, activate,
# route, or execute any software. A profile stays planned until its blockers are
# resolved by deterministic, legally reusable evidence. current_machine values are
# the fixed 2026-07-18 Apple Silicon observation above, not CI or runtime detection.
# Restricted-provider receipts are self-declared provenance only. Without external
# human trust supplied by the calling platform, they cannot establish installation
# authorization or raise any validation level.
profiles:
  pymatgen-wrapper:
    provider_id: pymatgen-wrapper
    profile_type: python-package
    role: structure-library
    source_tier: first-party-official
    software:
      name: pymatgen wrapper
      version: "2026.5.4"
      release_date: "2026-05-04"
    official_urls:
      - https://github.com/materialsproject/pymatgen/releases/latest
      - https://pypi.org/project/pymatgen/
    license:
      category: open-source
      identifier: MIT
      redistribution: allowed-with-license
      obligations:
        - Preserve the MIT notice when redistributing the package.
        - Treat external services and licensed potential data as separate resources.
    environment:
      targets:
        - platform: linux
          architectures: [x86_64, arm64]
        - platform: macos
          architectures: [x86_64, arm64]
        - platform: windows
          architectures: [x86_64]
      python:
        required: true
        min_inclusive: "3.11"
        max_exclusive: null
      compiler:
        required: false
        requirements: []
      mpi:
        required: false
        requirements: []
      gpu:
        required: false
        backends: []
    assets:
      model_license: not-applicable
      data_license: separate-attestation
      notes:
        - User structures, database responses, and potential metadata retain their own provenance.
    runtime_probe:
      kind: python-metadata
      target: pymatgen distribution metadata
      expected_identity: pymatgen 2026.5.4
      execution_policy: documentary-read-only
    known_exclusions:
      - The wrapper version does not establish the independently released core version.
      - Database access and licensed VASP potential content are outside this profile.
    current_machine:
      status: installed-compatible
      observations:
        - Apple Silicon arm64 with macOS 26.5.2 and Python 3.14.0.
        - Distribution metadata reports pymatgen 2026.5.4.
    planned_blockers:
      - Deterministic structure and serialization regressions have not been executed for this provider profile.
    maximum_validation_level: environment-verified

