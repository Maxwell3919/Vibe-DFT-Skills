schema_version: "1.0"

# This registry recognizes official documentation locations. Only a reviewed,
# exact-byte canonical snapshot declared here may establish offline content
# identity; every unpinned source still requires a platform adapter. Bundle
# fields and adapter receipts cannot add or widen authority entries.
authorities:
  qe-official-docs:
    display_name: Quantum ESPRESSO official documentation
    lifecycle: active
    provider_id: qe
    allowed_https_origins: ["https://www.quantum-espresso.org"]
    version_policy:
      allowed_scopes: [exact]
      registered_scopes:
        - {scope: exact, exact_version: "7.5", minimum_version: null, maximum_version: null, release_series: null}
    content_policy:
      source_kinds: [official-manual, official-reference, official-release-notes]
      allowed_path_prefixes: ["/Doc/"]
      query_policy: forbidden
      fragment_policy: forbidden
      resolution_mode: platform-verified-only
    content_identity_policy:
      mode: platform-adapter-only
      unpinned_action: adapter-required
    canonical_snapshot: null
    license_policy:
      status: unknown
      identifier: null
      terms_urls: []
      verification_status: unresolved
    redistribution_policy:
      allowed_values: [unknown]
      bundle_content: forbidden
      external_runtime_content: platform-verification-required
    limitations:
      - Official origin and documentation path are recognized, but source bytes and licensing remain externally verified facts.
    provenance:
      verified_utc: "2026-07-18T00:00:00Z"
      official_fact_urls: ["https://www.quantum-espresso.org/Doc/"]

  vasp-official-wiki:
    display_name: VASP official Wiki
    lifecycle: active
    provider_id: vasp
    allowed_https_origins: ["https://vasp.at", "https://www.vasp.at"]
    version_policy:
      allowed_scopes: [latest-at-retrieval]
      registered_scopes:
        - {scope: latest-at-retrieval, exact_version: null, minimum_version: null, maximum_version: null, release_series: null}
    content_policy:
      source_kinds: [official-manual, official-reference, official-release-notes]
      allowed_path_prefixes: ["/wiki/"]
      query_policy: forbidden
      fragment_policy: forbidden
      resolution_mode: platform-verified-only
    content_identity_policy:
      mode: platform-adapter-only
      unpinned_action: adapter-required
    canonical_snapshot: null
    license_policy:
      status: known-restricted
      identifier: "VASP website terms of use"
      terms_urls: ["https://vasp.at/footer/termsofuse/"]
      verification_status: verified
    redistribution_policy:
      allowed_values: [runtime-only, restricted]
      bundle_content: forbidden
      external_runtime_content: platform-verification-required
    limitations:
      - Wiki authority does not establish compatibility with a specific VASP binary version or redistribution permission.
    provenance:
      verified_utc: "2026-07-18T00:00:00Z"
      official_fact_urls: ["https://vasp.at/wiki/Main_page", "https://vasp.at/footer/termsofuse/"]

  cp2k-official-manual:
    display_name: CP2K official versioned manual
    lifecycle: active
    provider_id: cp2k
    allowed_https_origins: ["https://manual.cp2k.org"]
    version_policy:
      allowed_scopes: [exact]
      registered_scopes:
        - {scope: exact, exact_version: "2026.2", minimum_version: null, maximum_version: null, release_series: null}
    content_policy:
      source_kinds: [official-manual, official-reference, official-release-notes]
      allowed_path_prefixes: ["/cp2k-2026_2-branch/"]
      query_policy: forbidden
      fragment_policy: forbidden
      resolution_mode: canonical-pin-or-platform-verified
    content_identity_policy:
      mode: canonical-pinned-open-snapshot-or-platform-adapter
      unpinned_action: adapter-required
    canonical_snapshot:
      snapshot_id: cp2k-manual-2026-2
      manifest_path: skills/cp2k-rigorous-calculations/references/official-manual/manifest.json
      manifest_raw_sha256: 37242192094a13384491108850b96c06c0e7cdd058913913bd0681b558e55349
      artifact_basis: snapshot-file-exact-bytes
    license_policy:
      status: known-open
      identifier: "GPL-2.0-or-later"
      terms_urls: ["https://github.com/cp2k/cp2k/blob/master/LICENSE"]
      verification_status: verified
    redistribution_policy:
      allowed_values: [redistributable]
      bundle_content: canonical-pinned-open-only
      external_runtime_content: platform-verification-required
    limitations:
      - The canonical snapshot pins the bundled excerpts, not the distinct upstream raw page bytes; any refresh requires a reviewed manifest and digest update.
    provenance:
      verified_utc: "2026-07-18T00:00:00Z"
      official_fact_urls: ["https://manual.cp2k.org/cp2k-2026_2-branch/", "https://github.com/cp2k/cp2k/blob/master/LICENSE"]

