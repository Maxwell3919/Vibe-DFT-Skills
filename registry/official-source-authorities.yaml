      identifier: "CC-BY-NC-SA-4.0"
      terms_urls: ["https://gitlab.com/siesta-project/documentation/siesta-docs/-/blob/master/LICENSE"]
      verification_status: verified
    redistribution_policy:
      allowed_values: [runtime-only, restricted]
      bundle_content: forbidden
      external_runtime_content: platform-verification-required
    limitations:
      - The versioned documentation root is recognized; content identity and redistribution permission remain external trust decisions.
    provenance:
