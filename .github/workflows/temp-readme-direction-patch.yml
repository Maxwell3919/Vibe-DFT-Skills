name: Temporary README direction patch

on:
  push:
    branches:
      - docs/dft-research-workflow-direction-20260802

permissions:
  contents: write

jobs:
  patch-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/dft-research-workflow-direction-20260802
          fetch-depth: 0

      - name: Insert project direction and remove temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          heading = "# Vibe-DFT-Skills\n\n"
          block = (
              "> **当前判断**\n"
              ">\n"
              "> 我们尚未把“一个可靠的 DFT 研究者究竟如何工作”理解和表达清楚，"
              "因此现在直接自动化，极易把错误抽象固化进代码。\n\n"
          )

          if block not in text:
              if heading not in text:
                  raise SystemExit("README heading not found")
              text = text.replace(heading, heading + block, 1)
              path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/temp-readme-direction-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/temp-readme-direction-patch.yml
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "docs: record DFT Research Workflow direction"
          git push origin HEAD:docs/dft-research-workflow-direction-20260802
