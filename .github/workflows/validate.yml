name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core-python-${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python tools/run_tests.py
      - run: python tools/validate_all_skills.py

  development-offline:
    name: development-skill-offline-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python tools/run_source_skill_tests.py --lifecycle development --timeout-seconds 300

  trust-boundaries:
    name: trust-boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python tools/audit_semantic_obligations.py
      - run: python tools/audit_privacy.py --history
      - run: python tools/activation_ledger.py
      - run: python tools/build_distribution.py --check
      - run: python tools/audit_repository.py

  portability-smoke:
    name: portability-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python tools/software_registry.py
      - run: python tools/skill_registry.py
      - run: python tools/audit_semantic_obligations.py
      - run: python tools/activation_ledger.py
      - run: python tools/build_distribution.py --check

  diff-check:
    name: documentation-and-whitespace
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed-file whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="HEAD^"
          else
            base="HEAD"
          fi
          git diff --check "$base"...HEAD -- . ':(exclude)skills/qe-rigorous-calculations/references/official-*'
