observables:
  run-trace:
    title: Run and convergence trace
    scope: Extract generic electronic and ionic step traces without assessing material-specific physical validity.
    dataset_kind: run-trace-v1
    validators: [completion-marker, finite-values, ordered-steps, unit-declaration]
    analyses: [final-energy, iteration-count, force-trace]
    plots: [energy-trace, force-trace]
    codes:
      qe:
        maturity: format-fixture-validated
        required_evidence: [main-output]
        backends: [python.qe-text]
        backend_routes:
          python.qe-text:
            maturity: format-fixture-validated
            evidence_ref: postprocess-format-fixtures-v1
      vasp:
        maturity: format-fixture-validated
        required_evidence: [main-output]
        backends: [python.vasp-text]
        backend_routes:
          python.vasp-text:
            maturity: format-fixture-validated
            evidence_ref: postprocess-format-fixtures-v1
      cp2k:
        maturity: design-only
        required_evidence: [main-output]
        backends: [python.cp2k-text, cp2k.output-parse]
        backend_routes:
          python.cp2k-text:
            maturity: design-only
          cp2k.output-parse:
            maturity: design-only
      siesta:
        maturity: design-only
        required_evidence: [main-output]
        backends: [python.siesta-text]
        backend_routes:
          python.siesta-text:
            maturity: design-only
  bands:
    title: Electronic bands and projected bands
    scope: Normalize eigenvalues, path coordinates, labels, spin channels, and projection weights.
    dataset_kind: electronic-bands-v1
    validators: [finite-values, band-kpoint-dimensions, energy-reference, path-mapping]
    analyses: [band-edges, fermi-crossings, projection-sums]
    plots: [band-structure, fatband, bands-comparison, projection-overview, projection-panels]
    codes:
      qe:
        maturity: format-fixture-validated
        required_evidence: [eigenvalues, energy-reference]
        backends: [python.qe-bands, python.qe-fatband, python.band-views, qe.bands]
        backend_routes:
          python.qe-bands:
            maturity: format-fixture-validated
            evidence_ref: postprocess-format-fixtures-v1
          python.qe-fatband:
            maturity: format-fixture-validated
            evidence_ref: postprocess-format-fixtures-v1
          python.band-views:
            maturity: synthetic-validated
            evidence_ref: postprocess-synthetic-fixtures-v1
          qe.bands:
            maturity: design-only
      vasp:
        maturity: format-fixture-validated
