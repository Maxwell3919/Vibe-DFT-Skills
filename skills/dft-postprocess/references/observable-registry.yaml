          python.vasp-fatband:
            maturity: format-fixture-validated
            evidence_ref: postprocess-format-fixtures-v1
          python.vaspkit-table:
            maturity: synthetic-validated
            evidence_ref: postprocess-synthetic-fixtures-v1
          python.band-views:
            maturity: synthetic-validated
            evidence_ref: postprocess-synthetic-fixtures-v1
          python.py4vasp:
            maturity: design-only
          python.pymatgen:
            maturity: design-only
      cp2k:
        maturity: design-only
        required_evidence: [band-data, energy-reference]
        backends: [python.cp2k-text, cp2k.bands-convert]
        backend_routes:
          python.cp2k-text:
            maturity: design-only
          cp2k.bands-convert:
            maturity: design-only
      siesta:
        maturity: design-only
        required_evidence: [band-data, energy-reference]
        backends: [python.siesta-text]
        backend_routes:
          python.siesta-text:
            maturity: design-only
