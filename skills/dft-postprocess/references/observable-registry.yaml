observables:
  run-trace:
    title: Run and convergence trace
    scope: Extract generic electronic and ionic step traces without assessing material-specific physical validity.
    dataset_kind: run-trace-v1
    validators: [completion-marker, finite-values, ordered-steps, unit-declaration]
    analyses: [final-energy, iteration-count, force-trace]
    plots: [energy-trace, force-trace]
    codes:
      qe:
        maturity: real-artifact-validated
        required_evidence: [main-output]
        backends: [python.qe-text]
      vasp:
        maturity: real-artifact-validated
        required_evidence: [main-output]
        backends: [python.vasp-text]
      cp2k:
        maturity: design-only
        required_evidence: [main-output]
        backends: [python.cp2k-text, cp2k.output-parse]
      siesta:
        maturity: design-only
        required_evidence: [main-output]
        backends: [python.siesta-text]
  bands:
    title: Electronic bands and projected bands
    scope: Normalize eigenvalues, path coordinates, labels, spin channels, and projection weights.
    dataset_kind: electronic-bands-v1
    validators: [finite-values, band-kpoint-dimensions, energy-reference, path-mapping]
    analyses: [band-edges, fermi-crossings, projection-sums]
    plots: [band-structure, fatband, bands-comparison, projection-overview, projection-panels]
    codes:
      qe:
        maturity: real-artifact-validated
        required_evidence: [eigenvalues, energy-reference]
        backends: [python.qe-bands, python.band-views, qe.bands]
      vasp:
        maturity: real-artifact-validated
        required_evidence: [eigenvalues, k-path, structure, energy-reference]
        backends: [python.vasp-bands, python.vaspkit-table, python.band-views, python.py4vasp, python.pymatgen]
      cp2k:
        maturity: design-only
        required_evidence: [band-data, energy-reference]
        backends: [python.cp2k-text, cp2k.bands-convert]
      siesta:
        maturity: design-only
        required_evidence: [band-data, energy-reference]
        backends: [python.siesta-text]
  dos-pdos:
    title: Total and projected density of states
    scope: Normalize energy grids, total channels, projected channels, spin conventions, and aggregation metadata.
    dataset_kind: electronic-dos-v1
    validators: [finite-values, monotonic-energy-grid, grid-alignment, energy-reference, channel-mapping]
    analyses: [window-integral, value-at-reference, channel-sum]
    plots: [dos, pdos, bands-dos]
    codes:
      qe:
        maturity: real-artifact-validated
        required_evidence: [dos-table, energy-reference]
        backends: [python.qe-dos, qe.dos, qe.projwfc]
      vasp:
        maturity: real-artifact-validated
        required_evidence: [dos-data, structure, energy-reference]
        backends: [python.vasp-dos, python.py4vasp, python.pymatgen]
      cp2k:
        maturity: design-only
        required_evidence: [dos-data, energy-reference]
        backends: [python.cp2k-text, cp2k.pdos-convolve]
      siesta:
        maturity: design-only
        required_evidence: [dos-data, energy-reference]
        backends: [python.siesta-text]
  phonon:
    title: Phonon dispersion and density of states
    scope: Normalize q paths or meshes, frequencies, modes, interpolation provenance, and imaginary-frequency signs.
    dataset_kind: phonon-v1
    validators: [finite-values, q-mode-dimensions, frequency-unit, path-mapping, imaginary-mode-visibility]
    analyses: [frequency-extrema, imaginary-mode-count, phonon-dos-integral]
    plots: [phonon-dispersion, phonon-dos]
    codes:
      qe:
        maturity: real-artifact-validated
        required_evidence: [phonon-frequencies]
        required_parameters: [frequency-unit]
        backends: [python.qe-phonon, qe.q2r, qe.matdyn, qe.dynmat]
      vasp:
        maturity: design-only
        required_evidence: [force-constants-or-phonon-data, q-path-or-mesh]
        backends: [phonon.phonopy, python.pymatgen]
      cp2k:
        maturity: design-only
        required_evidence: [force-constants-or-phonon-data, q-path-or-mesh]
        backends: [python.cp2k-text]
      siesta:
        maturity: design-only
        required_evidence: [force-constants-or-phonon-data, q-path-or-mesh]
        backends: [python.siesta-text]
  epc:
    title: Electron-phonon coupling
    scope: Normalize smearing, q and mode contributions, lambda, alpha2F, logarithmic frequencies, and reported transition-temperature tables.
    dataset_kind: epc-v1
    validators: [finite-values, smearing-grid, q-weight-closure, mode-closure, frequency-alignment]
    analyses: [cumulative-lambda, smearing-sensitivity, q-contributions, mode-contributions]
    plots: [alpha2f, cumulative-lambda, smearing-series, q-mode-contributions]
    codes:
      qe:
        maturity: real-artifact-validated
        required_evidence: [epc-table, smearing-definition]
        backends: [python.qe-epc, qe.lambda, qe.alpha2f, qe.matdyn]
      vasp:
        maturity: design-only
        required_evidence: [epc-table, phonon-frequencies, smearing-definition]
        backends: [python.pymatgen]
      cp2k:
        maturity: design-only
        required_evidence: [epc-table, phonon-frequencies, smearing-definition]
        backends: [python.cp2k-text]
      siesta:
        maturity: design-only
        required_evidence: [epc-table, phonon-frequencies, smearing-definition]
        backends: [python.siesta-text]
  real-space:
    title: Real-space fields, charge partitioning, and work function
    scope: Normalize cells, grids, scalar fields, planar averages, atomic partitions, vacuum windows, and energy references.
    dataset_kind: real-space-v1
    validators: [finite-values, cell-grid-alignment, integral-check, coordinate-unit, energy-reference]
    analyses: [field-difference, planar-average, cumulative-integral, region-sum, vacuum-plateau]
    plots: [planar-profile, cumulative-profile, crystallographic-field-section, structure-isosurface, structure-top-side-views]
    codes:
      qe:
        maturity: real-artifact-validated
        required_evidence: [grid-field]
        required_parameters: [field-kind, field-unit]
        backends: [python.grid, python.structure-views, visualization.vesta, qe.pp, qe.average, charge.bader, charge.critic2]
      vasp:
        maturity: real-artifact-validated
        required_evidence: [grid-field]
        required_parameters: [field-kind, field-unit]
        backends: [python.grid, python.structure-views, visualization.vesta, python.py4vasp, python.pymatgen, charge.bader, charge.critic2]
      cp2k:
        maturity: design-only
        required_evidence: [grid-field]
        required_parameters: [field-kind, field-unit]
        backends: [python.cp2k-text]
      siesta:
        maturity: design-only
        required_evidence: [grid-field]
        required_parameters: [field-kind, field-unit]
        backends: [python.siesta-text]
  neb:
    title: Minimum-energy path and barrier
    scope: Normalize image order, reaction coordinate, energies, forces, convergence, and reference-energy transformations.
    dataset_kind: neb-v1
    validators: [finite-values, image-order, endpoint-presence, force-convergence, energy-reference]
    analyses: [forward-barrier, reverse-barrier, saddle-image]
    plots: [neb-profile, image-force]
    codes:
      qe:
        maturity: synthetic-validated
        required_evidence: [neb-table]
        required_parameters: [coordinate-column, energy-column, coordinate-unit, energy-unit, reference]
        backends: [python.neb]
      vasp:
        maturity: synthetic-validated
        required_evidence: [neb-table]
        required_parameters: [coordinate-column, energy-column, coordinate-unit, energy-unit, reference]
        backends: [python.neb, python.pymatgen]
      cp2k:
        maturity: design-only
        required_evidence: [neb-table]
        required_parameters: [coordinate-column, energy-column, coordinate-unit, energy-unit, reference]
        backends: [python.cp2k-text]
      siesta:
        maturity: design-only
        required_evidence: [neb-table]
        required_parameters: [coordinate-column, energy-column, coordinate-unit, energy-unit, reference]
        backends: [python.siesta-text]
  optical:
    title: Dielectric and optical spectra
    scope: Normalize frequency or energy grids, complex dielectric components, tensor channels, and broadening metadata.
    dataset_kind: optical-v1
    validators: [finite-values, monotonic-energy-grid, tensor-shape, unit-declaration, broadening-declaration]
    analyses: [component-extrema, absorption-derived-table]
    plots: [dielectric-spectrum, optical-spectrum]
    codes:
      qe:
        maturity: synthetic-validated
        required_evidence: [dielectric-data]
        required_parameters: [energy-column, components, broadening]
        backends: [python.optical, qe.epsilon]
      vasp:
        maturity: synthetic-validated
        required_evidence: [dielectric-data]
        required_parameters: [energy-column, components, broadening]
        backends: [python.optical, python.py4vasp, python.pymatgen]
      cp2k:
        maturity: design-only
        required_evidence: [dielectric-data]
        required_parameters: [energy-column, components, broadening]
        backends: [python.cp2k-text]
      siesta:
        maturity: design-only
        required_evidence: [dielectric-data]
        required_parameters: [energy-column, components, broadening]
        backends: [python.siesta-text]
