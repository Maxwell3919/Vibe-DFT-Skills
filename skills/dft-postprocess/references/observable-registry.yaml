validation_evidence:
  postprocess-format-fixtures-v1:
    evidence_class: format-fixture
    path: tests/test_postprocess.py
    sha256: "ec40ec7e7c87f7d34ad7319c238fcea807f7a221f290340191b639abf1280f20"
    command: [python3, -m, unittest, discover, -s, tests, -v]
    expected_result: {status: pass, return_code: 0}
    test_ids:
      - test_run_trace_normalizes_qe_and_vasp_without_equating_completion_with_geometry_convergence
      - test_qe_bands_normalizer_uses_explicit_energy_reference
      - test_qe_dos_normalizer_aggregates_standard_projected_files
      - test_qe_filproj_fatband_requires_and_applies_selector
