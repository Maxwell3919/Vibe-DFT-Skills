      bands/vasp/python.vasp-bands: [test_vasp_electronic_normalizers_share_generic_schemas]
      bands/vasp/python.vasp-fatband: [test_vasp_electronic_normalizers_share_generic_schemas]
      dos-pdos/qe/python.qe-dos: [test_qe_dos_normalizer_aggregates_standard_projected_files]
      dos-pdos/vasp/python.vasp-dos: [test_vasp_electronic_normalizers_share_generic_schemas]
