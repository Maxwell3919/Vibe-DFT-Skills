      run-trace/vasp/python.vasp-text: [test_run_trace_normalizes_qe_and_vasp_without_equating_completion_with_geometry_convergence]
      bands/qe/python.qe-bands: [test_qe_bands_normalizer_uses_explicit_energy_reference]
